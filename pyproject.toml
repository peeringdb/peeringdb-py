[project]
name = "peeringdb"
version = "2.5.0"
description = "PeeringDB Python client and library"
readme = "README.md"
authors = [{ name = "PeeringDB", email = "support@peeringdb.com" }]
license = { text = "BSD-2-Clause" }
requires-python = ">=3.11"
keywords = ["peeringdb", "networking", "peering", "internet", "api", "bgp", "asn"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
]
dependencies = [
    "confu>=1",
    "munge[toml,tomlkit,yaml]>=1.2.0",
    "twentyc.rpc>=1",
    "pyyaml>=6.0.1",
    "httpx>=0.24.1",
    "django_peeringdb>=3.1.0",
]

[dependency-groups]
dev = [
    "django>=4.2",
    "pytest>=8",
    "pytest-cov>=5",
    "tox>=4",
    "tox-gh-actions>=3",
    "tox-uv>=1.13.0",
    "mypy>=0.950",
    "types-requests",
    "types-PyYAML",
    "pre-commit>=2.13",
    # Keep in range with the ruff-pre-commit rev in .pre-commit-config.yaml.
    "ruff>=0.16",
    "markdown>=3",
    "markdown-include>=0.5,<1",
    "mkdocs>=1.2.3",
    "ctl>=1",
    "jinja2>=3",
    "tmpl>=1",
    "twine>=3",
]

[project.scripts]
peeringdb = "peeringdb.cli:main"

[project.urls]
repository = "https://github.com/peeringdb/peeringdb-py"
homepage = "https://www.peeringdb.com"
documentation = "https://peeringdb.github.io/peeringdb-py"
changelog = "https://github.com/peeringdb/peeringdb-py/blob/master/CHANGELOG.md"
issues = "https://github.com/peeringdb/peeringdb-py/issues"


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# `select`, not `extend-select`: this replaces ruff's built-in defaults rather
# than adding to them, so the rule set stays fixed across ruff releases.
select = [
    "UP",  # pyupgrade
    "I",   # isort
    "F",   # Pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "C90", # mccabe complexity
    "N",   # pep8-naming
]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["peeringdb"]
force-single-line = false
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*" = ["S101"]   # Allow assert statements in tests
# Command handlers take `config` (not `self`) as their first arg; @_handler
# turns them into staticmethods, which ruff's N805 check can't see.
"commands.py" = ["N805"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
strict = false

# Third-party packages without type information / stubs
[[tool.mypy.overrides]]
module = [
    "django.*",
    "confu.*",
    "munge.*",
]
ignore_missing_imports = true

# The resource classes are built dynamically by a metaclass (see resource.py) and
# carry a `tag` attribute mypy can't see; the sync path also reads attributes off
# concrete Django model instances.
[[tool.mypy.overrides]]
module = [
    "peeringdb.backend",
    "peeringdb._update",
    "peeringdb.commands",
]
disable_error_code = ["attr-defined"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
